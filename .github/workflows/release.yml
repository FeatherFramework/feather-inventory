name: release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: feather-inventory
    steps:
      - uses: actions/checkout@v4
        with:
          path: feather-inventory
      # Real cross-resource composition tests require these sibling sources.
      - uses: actions/checkout@v4
        with:
          repository: FeatherFramework/feather-access
          ref: f5c24d9f42dd24f3e6f287db8bd0b29493506d41
          path: feather-access
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeatherFramework/feather-weapons
          ref: 93b3f4321408eb28bfb0d74b9f38de12210136ed
          path: feather-weapons
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: feather-inventory/web/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full Lua regression suite and runtime syntax
        run: |
          python -m pip install lupa==2.8
          python tests/run_lua.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Install and verify UI
        working-directory: feather-inventory/web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Verify UI contracts
        run: node --test web/tests/*.test.mjs
      - name: Stage and verify install archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_release.py
          cp .artifacts/feather-inventory.zip .artifacts/feather-inventory.zip.sha256 .
          python3 scripts/verify_release.py feather-inventory.zip
          sha256sum -c feather-inventory.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: feather-inventory-install
          path: |
            feather-inventory/feather-inventory.zip
            feather-inventory/feather-inventory.zip.sha256

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: feather-inventory-install
      - name: Read package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main
        with:
          path: web
      - name: Verify release version and checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./web/package.json').version")
          grep -Fq "version '$version'" fxmanifest.lua
          sha256sum -c feather-inventory.zip.sha256
      - name: Publish automatic release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ steps.package-version.outputs.current-version }}
          prerelease: ${{ contains(steps.package-version.outputs.current-version, '-') }}
          title: Feather Inventory ${{ steps.package-version.outputs.current-version }}
          files: |
            feather-inventory.zip
            feather-inventory.zip.sha256
