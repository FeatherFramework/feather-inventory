name: Inventory checks and release

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: feather-inventory
    steps:
      - uses: actions/checkout@v4
        with:
          path: feather-inventory
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - name: Verify versions and release ancestry
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/verify_version.py --tag "$RELEASE_TAG"
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
          else
            python3 scripts/verify_version.py
          fi
      # Real cross-resource composition tests require these sibling sources.
      - uses: actions/checkout@v4
        with:
          repository: FeatherFramework/feather-access
          ref: f5c24d9f42dd24f3e6f287db8bd0b29493506d41
          path: feather-access
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FeatherFramework/feather-weapons
          ref: 93b3f4321408eb28bfb0d74b9f38de12210136ed
          path: feather-weapons
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: feather-inventory/web/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full Lua regression suite and runtime syntax
        run: |
          python -m pip install lupa==2.8
          python tests/run_lua.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Install and verify UI
        working-directory: feather-inventory/web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
      - name: Verify UI contracts
        run: node --test web/tests/*.test.mjs
      - name: Stage and verify install archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_release.py
          cp .artifacts/feather-inventory.zip .artifacts/feather-inventory.zip.sha256 .
          python3 scripts/verify_release.py feather-inventory.zip
          sha256sum -c feather-inventory.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: feather-inventory-install
          path: |
            feather-inventory/feather-inventory.zip
            feather-inventory/feather-inventory.zip.sha256

  publish:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@v4
        with:
          name: feather-inventory-install
      - name: Verify release version and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/verify_version.py --tag "$RELEASE_TAG"
          sha256sum -c feather-inventory.zip.sha256
      - name: Attach verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          # The maintainer creates the release through GitHub's release page.
          # Never overwrite existing assets or create a competing release.
          gh release upload "$RELEASE_TAG" feather-inventory.zip feather-inventory.zip.sha256
